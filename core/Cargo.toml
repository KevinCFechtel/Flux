[workspace]
members = ["crates/flux-core", "crates/flux-uniffi"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "BSD-3-Clause"
version = "0.1.0"

[workspace.dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
base64 = "0.22"
html5ever = "0.39"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "webp"] }
lofty = "0.22"
markup5ever_rcdom = "0.39"
resvg = { version = "0.45.1", default-features = false }
rusqlite = { version = "0.37", features = ["bundled"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rustls = { version = "0.23.43", default-features = false, features = ["ring"] }
rustls-platform-verifier = "=0.5.3"
thiserror = "2"
ureq = { version = "2.12", default-features = false, features = ["tls", "native-certs"] }
url = "2"
uniffi = { version = "0.29", features = ["cli"] }
tempfile = "3"
tiny-skia = "0.11"
tracing = "0.1"
tracing-subscriber = "0.3"
usvg = "0.45.1"
