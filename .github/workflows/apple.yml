name: Apple

on:
  pull_request:
    paths:
      - "apple/**"
      - "core/**"
      - ".github/workflows/apple.yml"
  push:
    branches:
      - main
      - apple-core-execution-hardening
    paths:
      - "apple/**"
      - "core/**"
      - ".github/workflows/apple.yml"

concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos:
    name: macOS tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim
      - name: Run macOS gate
        run: ./apple/macos/Build/test.sh

  ios:
    name: iOS tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim
      - name: Run iOS gate
        run: ./apple/ios/Build/test.sh
