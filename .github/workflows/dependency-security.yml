name: Dependency security (RustSec)

on:
  schedule:
    - cron: "13 6 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "core/Cargo.lock"
      - "core/Cargo.toml"
      - "core/crates/**/Cargo.toml"
      - ".github/workflows/dependency-security.yml"
  push:
    branches: [main]
    paths:
      - "core/Cargo.lock"
      - "core/Cargo.toml"
      - "core/crates/**/Cargo.toml"
      - ".github/workflows/dependency-security.yml"

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rustsec:
    name: Scan committed Cargo.lock for advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
      - name: Verify pinned Rust compiler
        run: rustc --version | grep -F 'rustc 1.99.1 '
      - name: Cache cargo audit binary and registry
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: false
          key: cargo-audit-v1
      - name: Install locked cargo-audit
        run: cargo install cargo-audit --locked
      # Both vulnerabilities and ecosystem warnings (including unmaintained
      # crates) block dependency acceptance and production releases.
      # Do not ignore or suppress advisories merely to make this job green.
      - name: Check committed Rust dependency tree (strict)
        run: cargo audit --file core/Cargo.lock --deny warnings
