name: F-Droid native build feasibility

on:
  pull_request:
    paths:
      - "Build/version.properties"
      - "Build/release.sh"
      - "android/**"
      - "core/**"
      - ".github/workflows/fdroid-native.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-build:
    name: Linux native APK and source dependency gate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ANDROID_NDK_VERSION: "29.0.14206865"
      FLUX_ANDROID_INCLUDE_ARMV7: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools
      - name: Install Android SDK and NDK
        run: |
          ANDROID_CLI="${ANDROID_HOME}/cmdline-tools/22.0/bin/android"
          test -x "${ANDROID_CLI}"
          "${ANDROID_CLI}" --sdk="${ANDROID_HOME}" sdk install "platforms/android-37.0"
          "${ANDROID_CLI}" --sdk="${ANDROID_HOME}" sdk install "build-tools/37.0.0"
          "${ANDROID_CLI}" --sdk="${ANDROID_HOME}" sdk install "ndk/${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "${GITHUB_ENV}"
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: aarch64-linux-android,x86_64-linux-android,armv7-linux-androideabi
      - name: Check Rust dependency lock and metadata
        run: |
          cargo metadata --locked --manifest-path core/Cargo.toml --format-version 1 > /dev/null
          cargo fetch --locked --manifest-path core/Cargo.toml
          cargo metadata --locked --offline --manifest-path core/Cargo.toml --format-version 1 > /dev/null
      - name: Build unsigned production APK from source
        run: bash Build/release.sh android
      - name: Verify APK identity and ABI coverage
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/production/release/app-production-release.apk"
          test -s "${apk}"
          unzip -Z1 "${apk}" | grep -q '^lib/arm64-v8a/libflux_uniffi.so$'
          unzip -Z1 "${apk}" | grep -q '^lib/x86_64/libflux_uniffi.so$'
          unzip -Z1 "${apk}" | grep -q '^lib/armeabi-v7a/libflux_uniffi.so$'
          "${ANDROID_HOME}/build-tools/37.0.0/aapt" dump badging "${apk}" | grep -F "package: name='de.circle_dev.flux_news' versionCode='2026101801'"
          sha256sum "${apk}" > fdroid-native-apk.sha256
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fdroid-native-feasibility
          path: |
            android/app/build/outputs/apk/production/release/*.apk
            fdroid-native-apk.sha256
          if-no-files-found: warn
          retention-days: 7
