name: F-Droid native build feasibility

on:
  pull_request:
    paths:
      - "Build/version.properties"
      - "Build/release.sh"
      - "android/**"
      - "core/**"
      - ".github/workflows/fdroid-native.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-build:
    name: Linux native APK and source dependency gate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ANDROID_NDK_VERSION: "29.0.14206865"
      FLUX_ANDROID_INCLUDE_ARMV7: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools
      - name: Install Android SDK and NDK
        run: |
          ANDROID_CLI="${ANDROID_HOME}/cmdline-tools/22.0/bin/android"
          test -x "${ANDROID_CLI}"
          "${ANDROID_CLI}" --sdk="${ANDROID_HOME}" sdk install "platforms/android-37.0"
          "${ANDROID_CLI}" --sdk="${ANDROID_HOME}" sdk install "build-tools/37.0.0"
          "${ANDROID_CLI}" --sdk="${ANDROID_HOME}" sdk install "ndk/${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "${GITHUB_ENV}"
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: aarch64-linux-android,x86_64-linux-android,armv7-linux-androideabi
      - name: Check Rust dependency lock and metadata
        run: |
          cargo metadata --locked --manifest-path core/Cargo.toml --format-version 1 > /dev/null
          cargo fetch --locked --manifest-path core/Cargo.toml
          cargo metadata --locked --offline --manifest-path core/Cargo.toml --format-version 1 > /dev/null
      - name: Build unsigned production APK from source
        run: bash Build/release.sh android
      - name: Verify APK identity and ABI coverage
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/production/release/app-production-release.apk"
          test -s "${apk}" || { echo "::error::Missing or empty APK: ${apk}"; exit 1; }
          echo "::group::Native libraries packaged in APK"
          unzip -Z1 "${apk}" | grep '^lib/' || true
          echo "::endgroup::"
          echo "::group::APK package metadata"
          "${ANDROID_HOME}/build-tools/37.0.0/aapt" dump badging "${apk}" | head -n 12
          echo "::endgroup::"
          missing=0
          for abi in arm64-v8a x86_64 armeabi-v7a; do
            if unzip -Z1 "${apk}" | grep -Fx "lib/${abi}/libflux_uniffi.so" >/dev/null; then
              echo "PASS: ${abi} native library"
            else
              echo "::error::Missing native library for ${abi}"
              missing=1
            fi
          done
          source Build/version.properties
          package_line=$("${ANDROID_HOME}/build-tools/37.0.0/aapt" dump badging "${apk}" | grep '^package:' | head -n 1)
          if [[ "${package_line}" == *"name='de.circle_dev.flux_news'"* && "${package_line}" == *"versionCode='${BUILD_NUMBER}'"* && "${package_line}" == *"versionName='${VERSION_NAME}'"* ]]; then
            echo "PASS: package ID and version match Build/version.properties"
          else
            echo "::error::Unexpected package metadata (expected de.circle_dev.flux_news, ${VERSION_NAME}, ${BUILD_NUMBER}): ${package_line}"
            missing=1
          fi
          sha256sum "${apk}" > fdroid-native-apk.sha256
          exit "${missing}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fdroid-native-feasibility
          path: |
            android/app/build/outputs/apk/production/release/*.apk
            fdroid-native-apk.sha256
          if-no-files-found: warn
          retention-days: 7
