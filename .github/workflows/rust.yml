name: Rust

on:
  pull_request:
    paths:
      - "core/**"
      - ".github/workflows/rust.yml"
  push:
    branches:
      - main
    paths:
      - "core/**"
      - ".github/workflows/rust.yml"

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workspace:
    name: Rust workspace regression gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt,clippy
      - name: Verify pinned Rust compiler
        run: rustc --version | grep -F 'rustc 1.99.1 '
      - name: Check Rust formatting
        run: cargo fmt --manifest-path core/Cargo.toml --all --check
      - name: Run Rust workspace tests
        if: success() || failure()
        run: cargo test --locked --manifest-path core/Cargo.toml --workspace
      - name: Lint Rust workspace
        if: success() || failure()
        run: cargo clippy --locked --manifest-path core/Cargo.toml --workspace --all-targets
